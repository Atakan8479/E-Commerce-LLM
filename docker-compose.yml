services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flashsale-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - flashsale_sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" > /dev/null || exit 1"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s


  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    container_name: flashsale-redpanda

    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info

    ports:
      - "19092:19092"

    volumes:
      - flashsale_redpanda_data:/var/lib/redpanda/data

    healthcheck:
      test:
        [
          "CMD",
          "rpk",
          "cluster",
          "info",
          "-X",
          "brokers=localhost:9092"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s


  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    container_name: flashsale-redpanda-init

    depends_on:
      redpanda:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c

    command:
      - >
        rpk topic create inventory.stock-depleted
        --partitions 1
        --replicas 1
        --if-not-exists
        -X brokers=redpanda:9092


volumes:
  flashsale_sql_data:
  flashsale_redpanda_data: