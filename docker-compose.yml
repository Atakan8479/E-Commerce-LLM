name: e-ticaret-llm

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flashsale-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}"

    ports:
      - "1433:1433"

    volumes:
      - flashsale_sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" > /dev/null || exit 1"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s


  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    container_name: flashsale-redpanda

    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info

    ports:
      - "19092:19092"

    volumes:
      - flashsale_redpanda_data:/var/lib/redpanda/data

    healthcheck:
      test:
        [
          "CMD",
          "rpk",
          "cluster",
          "info",
          "-X",
          "brokers=localhost:9092"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s


  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    container_name: flashsale-redpanda-init

    depends_on:
      redpanda:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c

    command:
      - >
        rpk topic create inventory.stock-depleted
        --partitions 1
        --replicas 1
        --if-not-exists
        -X brokers=redpanda:9092
        &&
        rpk topic create inventory.stock-depleted.dlq
        --partitions 1
        --replicas 1
        --if-not-exists
        -X brokers=redpanda:9092


  redis:
    image: redis:8.10.1
    container_name: flashsale-redis

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - flashsale_redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s


  migrate:
    image: flashsale-api:local

    build:
      context: .
      dockerfile: src/ECommerce.FlashSaleOrchestrator.Api/Dockerfile

    container_name: flashsale-migrate

    command:
      - "--migrate"

    environment:
      FLASHSALE_SQL_CONNECTION: >-
        Server=sqlserver,1433;Database=FlashSaleOrchestrator;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set};Encrypt=True;TrustServerCertificate=True

    depends_on:
      sqlserver:
        condition: service_healthy

    restart: "no"


  api:
    image: flashsale-api:local

    build:
      context: .
      dockerfile: src/ECommerce.FlashSaleOrchestrator.Api/Dockerfile

    container_name: flashsale-api

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"

      FLASHSALE_SQL_CONNECTION: >-
        Server=sqlserver,1433;Database=FlashSaleOrchestrator;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set};Encrypt=True;TrustServerCertificate=True

      Kafka__BootstrapServers: "redpanda:9092"

    ports:
      - "5185:8080"

    depends_on:
      migrate:
        condition: service_completed_successfully

      redpanda-init:
        condition: service_completed_successfully


  worker:
    image: flashsale-worker:local

    build:
      context: .
      dockerfile: src/ECommerce.FlashSaleOrchestrator.Worker/Dockerfile

    container_name: flashsale-worker

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"

      FLASHSALE_SQL_CONNECTION: >-
        Server=sqlserver,1433;Database=FlashSaleOrchestrator;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set};Encrypt=True;TrustServerCertificate=True

      Kafka__BootstrapServers: "redpanda:9092"

      FLASHSALE_OPENAI_MODEL_ID: "${FLASHSALE_OPENAI_MODEL_ID:?FLASHSALE_OPENAI_MODEL_ID must be set}"
      FLASHSALE_OPENAI_ENDPOINT: "${FLASHSALE_OPENAI_ENDPOINT:?FLASHSALE_OPENAI_ENDPOINT must be set}"
      FLASHSALE_LLM_REQUEST_TIMEOUT_SECONDS: "${FLASHSALE_LLM_REQUEST_TIMEOUT_SECONDS:-30}"
      FLASHSALE_OPENAI_API_KEY: "${FLASHSALE_OPENAI_API_KEY:?FLASHSALE_OPENAI_API_KEY must be set}"

      FLASHSALE_EMBEDDING_MODEL_ID: "${FLASHSALE_EMBEDDING_MODEL_ID:?FLASHSALE_EMBEDDING_MODEL_ID must be set}"

      FLASHSALE_REDIS_ENDPOINT: "redis:6379"
      FLASHSALE_REDIS_CONNECT_TIMEOUT_SECONDS: "${FLASHSALE_REDIS_CONNECT_TIMEOUT_SECONDS:-5}"
      FLASHSALE_REDIS_OPERATION_TIMEOUT_SECONDS: "${FLASHSALE_REDIS_OPERATION_TIMEOUT_SECONDS:-5}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"

    ports:
      - "8081:8081"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      migrate:
        condition: service_completed_successfully

      redpanda-init:
        condition: service_completed_successfully

      redis:
        condition: service_healthy


volumes:
  flashsale_sql_data:
  flashsale_redpanda_data:
  flashsale_redis_data: